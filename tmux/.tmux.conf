# Set prefix

unbind C-b
set -g prefix `
set -g prefix2 §
bind ` send-prefix

# General

set -g escape-time 0             # Disable delays on escape sequences
set -g repeat-time 1000          # Increase "prefix-free" window switch time
set -g base-index 1              # Start window numbers at 1
set -g pane-base-index 1         # Start pane numbers at 1
set -g renumber-windows on       # Renumber windows sequentially on close
set -g mouse on                  # Enable mouse support
set -g status-position top       # Move status line to the top

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

setw -g mode-keys vi             # Use Vi key bindings in copy mode

# Keybinds

unbind r
bind r source-file ~/.tmux.conf
bind s choose-tree -sZ -O name

# Pane navigation shortcuts
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind = split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Window swapping
bind -r Left swap-window -t -1 \; select-window -t -1
bind -r Right swap-window -t +1 \; select-window -t +1

# Palette

# Catppuccin Mocha
theme_bg_dark="#1E1E2E" # base
theme_bg_medium="#313244" # surface0
theme_bg_slate="#45475A" # surface1
theme_fg_subtle="#BAC2DE" # subtext1
theme_fg_light="#CDD6F4" # text
theme_teal_soft="#94E2D5" # teal
theme_cyan_soft="#89DCEB" # sky
theme_blue_main="#89B4FA" # blue
theme_red_error="#F38BA8" # red
theme_yellow_soft="#F9E2AF" # yellow
theme_green_soft="#A6E3A1" # green

# Nord
# theme_bg_dark="#2E3440" # nord0
# theme_bg_medium="#3B4252" # nord1
# theme_bg_slate="#434C5E" # nord3
# theme_fg_subtle="#D8DEE9" # nord4
# theme_fg_light="#ECEFF4" # nord6
# theme_teal_soft="#8FBCBB" # nord7
# theme_cyan_soft="#88C0D0" # nord8
# theme_blue_main="#81A1C1" # nord9
# theme_red_error="#BF616A" # nord11
# theme_yellow_soft="#EBCB8B" # nord13
# theme_green_soft="#A3BE8C" # nord14

# Status Bar Appearance

set -g status-left-length 100
set -g status-style "fg=${theme_fg_subtle},bg=default"
set -g status-left "#{?client_prefix,  ,   }#[fg=${theme_bg_dark},bg=${theme_green_soft},bold] #S #[default] "
set -g status-right ""
set -g window-status-style default
set -g window-status-current-style "fg=${theme_bg_dark},bg=${theme_cyan_soft},bold"
set -g window-status-current-format "#{p4: #{?automatic-rename,#I,#I:#W}#F }"
set -g window-status-format "#{p4: #{?automatic-rename,#I,#I:#W}#F }"
set -g message-style "fg=${theme_fg_light},bg=${theme_bg_medium}"
set -g mode-style "fg=${theme_bg_dark},bg=${theme_blue_main},bold"
set -g pane-border-style "fg=${theme_bg_medium}"
set -g pane-active-border-style "fg=${theme_blue_main}"
set -g pane-border-format " #{pane_index} "
set-hook -g after-split-window 'setw pane-border-status top'
set-hook -g after-kill-pane 'if-shell -F "#{==:#{window_panes},1}" "setw pane-border-status off" "setw pane-border-status top"'

# Notifications
setw -g monitor-bell on
set -g bell-action other
setw -g window-status-bell-style "fg=${theme_bg_dark},bg=${theme_fg_light},bold"

# Agent Sidebar
# Installed via TPM (see Plugins below). Behavior options must be set before
# the plugin sources agent-sidebar.conf, which only seeds unset values.

set -g @sidebar_width 20
set -g @sidebar_position left
set -g @sidebar_bottom_height 20
set -g @agent-sidebar-default-agent opencode

# Colors are re-read every time the sidebar starts, so they can live anywhere.

set -g @sidebar_color_accent "${theme_cyan_soft}"
set -g @sidebar_color_border "${theme_bg_medium}"
set -g @sidebar_color_selection "${theme_bg_dark}"
set -g @sidebar_color_session "${theme_blue_main}"

set -g @sidebar_color_all "${theme_cyan_soft}"
set -g @sidebar_color_running "${theme_green_soft}"
set -g @sidebar_color_waiting "${theme_yellow_soft}"
set -g @sidebar_color_idle "${theme_fg_subtle}"
set -g @sidebar_color_error "${theme_red_error}"
set -g @sidebar_color_filter_inactive "${theme_bg_slate}"

set -g @sidebar_color_agent_opencode "${theme_blue_main}"

set -g @sidebar_color_text_active "${theme_fg_light}"
set -g @sidebar_color_text_muted "${theme_fg_subtle}"
set -g @sidebar_color_text_inactive "${theme_bg_slate}"
set -g @sidebar_color_port "${theme_bg_slate}"
set -g @sidebar_color_wait_reason "${theme_yellow_soft}"
set -g @sidebar_color_response_arrow "${theme_cyan_soft}"

set -g @sidebar_color_branch "${theme_teal_soft}"
set -g @sidebar_color_commit_hash "${theme_yellow_soft}"
set -g @sidebar_color_diff_added "${theme_green_soft}"
set -g @sidebar_color_diff_deleted "${theme_red_error}"
set -g @sidebar_color_file_change "${theme_yellow_soft}"
set -g @sidebar_color_pr_link "${theme_blue_main}"

set -g @sidebar_color_section_title "${theme_teal_soft}"
set -g @sidebar_color_activity_timestamp "${theme_teal_soft}"

# Plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'hiroppy/tmux-agent-sidebar'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialise TMUX plugin manager (keep this line at the very bottom of .tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
