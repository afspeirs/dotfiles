# Set prefix

unbind C-b
set -g prefix `
set -g prefix2 §
bind ` send-prefix

# General

set -g escape-time 0             # Disable delays on escape sequences
set -g repeat-time 1000          # Increase "prefix-free" window switch time
set -g base-index 1              # Start window numbers at 1
set -g pane-base-index 1         # Start pane numbers at 1
set -g renumber-windows on       # Renumber windows sequentially on close
set -g mouse on                  # Enable mouse support
set -g status-position top       # Move status line to the top

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

setw -g mode-keys vi             # Use Vi key bindings in copy mode

# Keybinds

unbind r
bind r source-file ~/.tmux.conf
bind s choose-tree -sZ -O name

# Pane navigation shortcuts
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind = split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Window swapping
bind -r Left swap-window -t -1 \; select-window -t -1
bind -r Right swap-window -t +1 \; select-window -t +1

# Palette

nord_bg_dark="#2E3440" # nord0
nord_bg_medium="#3B4252" # nord1
nord_fg_subtle="#D8DEE9" # nord4
nord_fg_light="#ECEFF4" # nord6
nord_cyan_soft="#88C0D0" # nord8
nord_blue_main="#81A1C1" # nord9
nord_red_error="#BF616A" # nord11
nord_green_soft="#A3BE8C" # nord14

# Status Bar Appearance

set -g status-left-length 100
set -g status-style "fg=${nord_fg_subtle},bg=default"
set -g status-left "#{?client_prefix,  ,   }#[fg=${nord_bg_dark},bg=${nord_green_soft},bold] #S #[default] "
set -g status-right ""
set -g window-status-style default
set -g window-status-current-style "fg=${nord_bg_dark},bg=${nord_cyan_soft},bold"
set -g window-status-current-format "#{p4: #{?automatic-rename,#I,#I:#W}#F }"
set -g window-status-format "#{p4: #{?automatic-rename,#I,#I:#W}#F }"
set -g message-style "fg=${nord_fg_light},bg=${nord_bg_medium}"
set -g mode-style "fg=${nord_bg_dark},bg=${nord_blue_main},bold"
set -g pane-border-style "fg=${nord_bg_medium}"
set -g pane-active-border-style "fg=${nord_blue_main}"

# Notifications
setw -g monitor-bell on
set -g bell-action other
setw -g window-status-bell-style "fg=${nord_bg_dark},bg=${nord_fg_light},bold"

# Plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialise TMUX plugin manager (keep this line at the very bottom of .tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
